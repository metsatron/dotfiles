{{ define "main" }}
<article class="window hero-window">
  <h1 class="window-tab">{{ .Title }}</h1>
  <div class="window-body hero-body">
    {{ with resources.Get "img/tp-logo.png" | fingerprint }}
    <img class="hero-logo" src="{{ .RelPermalink }}" alt="Tiago Pires — Lifestyle Technology" width="209" height="128">
    {{ end }}
    <div class="hero-copy">
      {{ .Content }}
    </div>
  </div>
</article>

<ul class="desktop">
  {{ range sort site.Params.rooms "weight" }}
  <li>
    <section class="window">
      <h2 class="window-tab"><a href="/{{ .slug }}/">{{ .title }}</a></h2>
      <div class="window-body">
        <p class="room-blurb">{{ .blurb }}</p>
        <p class="room-enter"><a href="/{{ .slug }}/">Enter the {{ .nav | lower }} →</a></p>
      </div>
    </section>
  </li>
  {{ end }}
</ul>
{{ end }}
