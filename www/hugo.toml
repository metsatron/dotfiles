baseURL = "https://tiagopires.com/"
languageCode = "en-au"
title = "Tiago Pires"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Web architect, systems builder, sovereign technology practitioner. Twenty years of web systems, a decade of lineage medicine — one life."
  author = "Tiago Pires"
  email = "tiago@tiagopires.com"
  dotcortexGithub = "https://github.com/metsatron/dotfiles"
  dotcortexGitlab = "https://gitlab.com/metsatron/dotfiles"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

# The nine rooms, in desktop order. Each maps to a real room in the stack.
# weight = window stacking/reading order on the home desktop.
