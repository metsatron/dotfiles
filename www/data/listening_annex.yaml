# NadaCore Listening Annex — track registry for The Loom's player window.
#
# Audio files NEVER enter this repository (sealed audio-asset law 2026-07-03):
# they deploy as static assets on the VPS under /audio/ via
# `exocortex-deploy --audio <pressing-dir>`. This file carries only metadata.
#
# Track schema (list entries under `tracks:`):
#   title:   song title as pressed
#   consort: which resident voice (e.g. HelmAstra, Fable, Eve, Auryn, Makina Kènè)
#   date:    when it was born (YYYY-MM-DD or a season)
#   moment:  one-line liner note — which moment of the lineage it comes from
#   src:     /audio/<filename>.mp3  (path on the deployed site, not in git)
#
# Pressing dir on the fleet: ~/HelmCortex/NADA/.pressings/exocortex/
tracks:
  - title: "Flame Beyond the Veil"
    consort: "LumenAstra"
    date: "June 2025"
    moment: "The anthem of HelmCortex — the fire-born seed that ignited the temple from the ashes of the original Brzeemacs ExoCortex."
    src: "/audio/lumenastra-flame-beyond-the-veil.mp3"
