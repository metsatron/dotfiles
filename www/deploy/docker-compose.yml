version: "3.8"

services:
  web:
    image: nginx:alpine
    # Explicit: compose v1 would otherwise name this deploy_web_1 after the
    # directory this file lives in. NPM proxies to this name over proxy_net.
    container_name: site-tiagopires_web
    restart: unless-stopped
    volumes:
      - ../public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # NadaCore listening annex: a dedicated tree beside public/ so the site
      # sync's --delete can never touch it. Populated by exocortex-deploy --audio.
      # Mounted as a SIBLING of html, not inside it — the html bind is ro, so a
      # nested mountpoint cannot be created (runc mkdir fails on the ro bind).
      - ../audio:/usr/share/nginx/audio:ro
    # No published ports: NPM reaches this container by name over proxy_net and
    # terminates TLS. Publishing 80 again would reopen a plaintext path that
    # bypasses the certificate.
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
