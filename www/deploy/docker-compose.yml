version: "3.8"

services:
  web:
    image: nginx:alpine
    # Explicit: compose v1 would otherwise name this deploy_web_1 after the
    # directory this file lives in. NPM proxies to this name over proxy_net.
    container_name: site-tiagopires_web
    restart: unless-stopped
    volumes:
      - ../public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Staging port for review before the DNS cutover. Once NPM fronts the
      # site over proxy_net this publish can be dropped.
      - "8080:80"
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
