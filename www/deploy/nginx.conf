server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;

    gzip on;
    gzip_min_length 256;
    gzip_types text/html text/css application/xml application/rss+xml application/atom+xml image/svg+xml text/plain;

    # nginx add_header does NOT inherit into any location that declares its own
    # add_header, so the security trio is repeated in every location below.
    # No HSTS here: TLS terminates at Nginx Proxy Manager upstream, not in this container.

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hugo fingerprints its CSS, so assets are safe to cache for a year.
    location ~* \.(css|js|woff2?|png|jpe?g|svg|ico)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Every section emits its own index.xml feed; sitemap.xml sits at the root.
    # Force application/xml so feeds render rather than download.
    location ~* \.xml$ {
        types { }
        default_type application/xml;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # NadaCore listening annex: deploy-time static audio mounted at html/audio
    # from the host's site audio/ tree (exocortex-deploy --audio). Never in git,
    # never part of the Hugo build; nginx serves byte ranges natively for seeking.
    location /audio/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Serves the theme 404 once a 404 template exists; nginx falls back to its
    # own 404 until then.
    error_page 404 /404.html;
}
