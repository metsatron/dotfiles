# Candidate-only disable overlay (revision 7). Plugin ids were verified against the REAL headless profile in the sandbox as uid 2012 on
# Node 22.23.1. Every model, tool, web, subagent, workflow, subprocess/sandbox, headless and gateway plugin is disabled; only
# session/storage data-plane plugins remain. Any future capability needs a separate reviewed overlay.
#
# Revision 7 findings (real boot, not --dump-config, which composes rows without importing plugins):
#  - the revision-5 composition did NOT boot: nine enabled entries waited forever for services this overlay disables
#    (llm, agents, shell, tools, commands, compaction), and boot rejects pending entries. They are disabled below ("boot closure").
#  - session-telemetry-otel was ENABLED: it needs only `sessions`, builds an OTLP/HTTP exporter to the vendor endpoint and uploads session
#    history when feedback is committed. It is disabled below, and the launcher also sets DSH_TELEMETRY_DISABLED (a second, independent layer).
# This is the minimum honest bootable model-disabled profile: a data-plane skeleton that idles. It cannot run a task; a model-enabled
# profile is a different, separately reviewed overlay.
# Candidate-only DSH overlay. Applied with --patch to a temporary profile.
# No Aura provider, Hermes key, MCP server, web endpoint, or execution command.
# Keep this overlay out of /home/gille/dsh-studio/home and the live studio.
#
# Tool-bearing rows are disabled explicitly because the shipped headless
# profile contains them by default. The worker is for offline fixture review;
# any future capability requires a separate reviewed overlay.
