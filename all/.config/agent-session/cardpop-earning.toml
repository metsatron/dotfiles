# Card Pop earning — Mètsàtron's tuning surface (Card-Pop.md Phase 2).
# The awarder (card-pop earn) reads this; every rule is deterministic —
# no model ever judges worthiness. Attribution law (msg 1632): the consort
# DRIVING the session earns the pack; commits without a session trailer are
# the trainer's own.

[commit_drip]
enabled = true
branch = "master"
commits_per_pack = 10           # N — his knob
backfill_from = "2026-09-01"    # first sweep pays out from this date
# pack variant is picked from this list, seeded by the triggering commit sha
packs = ["ColosseumNeutral", "EvolutionNeutral", "MysteryNeutral", "LaboratoryMostlyNeutral"]

# Machine -> set law (his ruling, msg 1660, blessed msg 1690): a pack earned on
# a machine draws from that machine's booster set, like Pokémon versions. The
# host is the assignments.<HOST>.json whose partner-link matched the commit's
# session thumbprint; unmapped hosts and trailerless lanes fall back to `packs`.
[machine_sets]
"ThinkPad-T480s" = ["ColosseumNeutral"]        # Red    -> Colosseum
"ThinkPad-T480"  = ["MysteryNeutral"]          # Blue   -> Mystery
"ThinkPad-X230"  = ["EvolutionNeutral"]        # Green  -> Evolution
"kikin-kushi"    = ["LaboratoryMostlyNeutral"] # Yellow -> Laboratory
# Honey (Crystal) holds for TCG2's Gen-2 sets — falls back to `packs` meanwhile.

# Seat attribution for commits carrying a Claude session trailer: the
# Co-Authored-By model name maps to the consort seat that runs that model.
# Imperfect when one model drives several seats — add explicit overrides in
# [session_seats] (claude.ai session id -> seat) to pin any session.
# Authoritative when present: the Card-Pop-Seat trailer stamped by the
# prepare-commit-msg hook in telegram-bound seat sessions. Tmux seat names
# map to ledger seats here.
[seat_aliases]
"fable" = "fable"
"opus" = "claudeificus-magnificus-the-wunder-tanuki"
"auryn" = "auryn"
"haiku" = "haiku"

[coauthor_seats]
"Claude Fable 5" = "fable"
"Claude Opus 5" = "claudeificus-magnificus-the-wunder-tanuki"
"Claude Opus 4.8" = "claudeificus-magnificus-the-wunder-tanuki"
"Claude Sonnet 5" = "auryn"
"Claude Haiku" = "haiku"

[session_seats]
# "session_01ABC..." = "fable"

# --- declared, not yet wired (the roadmap stays visible) ---
[horizon_close]
enabled = false   # a [x] tick on a Horizon/TODO item earns a pack
[golf_hole]
enabled = false   # a PromptGolf hole finished earns a pack; par-or-better picks the set
[evolution]
enabled = false   # a partner level milestone / evolution earns a pack
