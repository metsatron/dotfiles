NAME="Logseq DB"
FORGE="github"
REPO="logseq/logseq"
TYPE="appimage"
APPIMG_NAME="Logseq-linux-x86_64"
ASSET_RE='Logseq-linux-x86_64-.*\.AppImage$'
PRERELEASE=1
# DB (graph-database) version lives on nightly/pre-release track as of May 2026.
# Release tag is "nightly"; assets are versioned (e.g. Logseq-linux-x86_64-2.0.1.AppImage).
# Stable releases/latest serves the OG file-based version; PRERELEASE=1 queries
# pre-releases to reach the DB nightly instead.
