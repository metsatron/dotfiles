NAME="OpenCode"
FORGE="github"
REPO="anomalyco/opencode"
TYPE="appimage"
APPIMG_NAME="opencode-desktop"
ASSET_RE='opencode-desktop-linux-x86_64\.AppImage$'
# Upstream renamed the asset opencode-electron-* → opencode-desktop-* (seen at
# v1.17.x); the old regex matched nothing and the app silently stopped updating.
# anomalyco/opencode is the working mirror; sst/opencode is private/defunct
# Alternative with broader libc compatibility (musl/older glibc):
# REPO="pkgforge-dev/opencode-AppImage-Enhanced"
# ASSET_RE='OpenCode-v.*-anylinux-x86_64\.AppImage$'
# pkgforge builds are by @Samueru-sama and target portable compatibility
