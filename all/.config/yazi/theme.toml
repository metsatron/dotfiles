# LainCore DreamWeave — mapped from all/.config/rofi/colors/laincore-dreamweave.rasi
# base16 source: style.org `dreamweaver-cc2017` (lc/syntax / lc/ui)

[mgr]
cwd             = { fg = "#268bd2" }
hovered         = { fg = "#1f1f1f", bg = "#15b8cf" }
preview_hovered = { underline = true }
find_keyword    = { fg = "#b58900", italic = true }
find_position   = { fg = "#4caf50", bg = "reset", italic = true }
marker_copied   = { fg = "#4caf50", bg = "#4caf50" }
marker_cut      = { fg = "#dc322f", bg = "#dc322f" }
marker_marked   = { fg = "#15b8cf", bg = "#15b8cf" }
marker_selected = { fg = "#b58900", bg = "#b58900" }
tab_active      = { fg = "#1f1f1f", bg = "#15b8cf" }
tab_inactive    = { fg = "#d2d4d4", bg = "#242424" }
tab_width       = 1
count_copied    = { fg = "#1f1f1f", bg = "#4caf50" }
count_cut       = { fg = "#1f1f1f", bg = "#dc322f" }
count_selected  = { fg = "#1f1f1f", bg = "#b58900" }
border_symbol   = "│"
border_style    = { fg = "#454545" }

[mode]
normal_main = { fg = "#1f1f1f", bg = "#15b8cf" }
normal_alt  = { fg = "#15b8cf", bg = "#242424" }
select_main = { fg = "#1f1f1f", bg = "#4caf50" }
select_alt  = { fg = "#4caf50", bg = "#242424" }
unset_main  = { fg = "#1f1f1f", bg = "#dc322f" }
unset_alt   = { fg = "#dc322f", bg = "#242424" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#242424", bg = "#242424" }
progress_label  = { fg = "#d2d4d4", bold = true }
progress_normal = { fg = "#15b8cf", bg = "#242424" }
progress_error  = { fg = "#dc322f", bg = "#242424" }
perm_type = { fg = "#268bd2" }
perm_read = { fg = "#b58900" }
perm_write = { fg = "#dc322f" }
perm_exec = { fg = "#4caf50" }
perm_sep = { fg = "#6a6a6a" }

[input]
border   = { fg = "#15b8cf" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#15b8cf" }
active   = { fg = "#15b8cf" }
inactive = {}

[confirm]
border  = { fg = "#15b8cf" }
title   = {}
content = {}
list    = {}
btn_yes = { fg = "#1f1f1f", bg = "#15b8cf" }
btn_no  = {}

[filetype]
rules = [
  { url = "*/", fg = "#ffcb63" },
  { mime = "image/*", fg = "#a681d6" },
  { mime = "video/*|audio/*", fg = "#a681d6" },
  { mime = "application/zip|application/gzip|application/x-tar|application/x-bzip2|application/x-7z-compressed|application/x-rar", fg = "#cb4b16" },
  { url = "*", fg = "#d2d4d4" },
]
