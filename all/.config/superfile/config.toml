##############################################
#                                            #
#           Superfile Configuration          #
#                                            #
##############################################

# DotCortex-managed (term.org). Do not edit in place — edit term.org and re-tangle.
# Docs: https://superfile.dev/configure/superfile-config/.

###############################################################################
#                                   Defaults                                  #
###############################################################################

#-- File Editor
# Empty means $EDITOR, which shell.org sets to nvim.
editor = ""

#-- Directory Editor
dir_editor = ""

#-- Auto check for update
# superfile is pinned by app.org (tar_gz + sha256); upgrades happen by editing that
# manifest, so an in-band update nag would only advertise a version we do not install.
auto_check_update = false

#-- cd on quit
# Requires a shell wrapper around `spf --print-last-dir`; left off until that exists.
cd_on_quit = false

#-- File Preview
default_open_file_preview = true

#-- Image Preview
show_image_preview = true

#-- File Info Footer
show_panel_footer_info = true

#-- Default Directory
default_directory = "."

#-- File Size Units
# false: IEC binary units of 1024 (KiB, MiB, GiB).
file_size_use_si = false

#-- Default File Sort Type
# (0: Name, 1: Size, 2: Date Modified, 3: Type, 4: Natural).
# Natural sorts file2 before file10, which is the humane default for numbered files.
default_sort_type = 4

#-- Sort Order Reversing
sort_order_reversed = false

#-- Case-Sensitive Sorting
case_sensitive_sort = false

#-- Exit Shell on Success
shell_close_on_success = false

#-- Page Scroll Size
page_scroll_size = 0

#-- Debug Mode
debug = false

#-- Ignore Missing Config Fields
# Kept false deliberately: a superfile upgrade that adds a field should fail loudly
# here rather than silently take an upstream default we never chose.
ignore_missing_fields = false

#-- File Panel Extra Columns Count
# 0 disables the feature entirely and wastes the panel's width on names alone.
# 2 = Size + Modify time (measured against spf v1.6.0; 3 adds Permission).
file_panel_extra_columns = 2

#-- File name width in File Panel
# Percentage of file panel width given to names (25-100); the rest carries the
# columns above. 45 keeps names readable inside the now-narrower file panel.
file_panel_name_percent = 45


###############################################################################
#                                   Styling                                   #
###############################################################################

#-- Theme
# Valid values are the filenames in ~/.config/superfile/theme/ — the 21 themes
# shipped by the binary (listed in the term.org prose above this block) plus
# laincore-dreamweaver-dark, which DotCortex authors and stows in beside them.
theme = "laincore-dreamweaver-dark"

#-- Code Previewer
# "" for builtin chroma, "bat" for bat.
code_previewer = ""

#-- Nerd Fonts Support
nerdfont = true

#-- Show checkbox icons in select mode
show_select_icons = true

#-- Transparent Background Support
transparent_background = false

#-- File Preview Panel Width
# Width of the preview panel is 1/n of the total width, so LOWER n = WIDER
# preview. 2 is the maximum: measured on a 190-column terminal against spf
# v1.6.0, n=2 gives the preview 43% of the screen, n=3 gives 28%, n=4 21% and
# n=6 14%. n=1 is rejected and renders nothing. n=0 ("match the file panel")
# behaves identically to 2, so 2 is stated explicitly rather than implied.
#
# Measure this with a real 2D screen capture (tmux capture-pane), never by
# reading the length of a rendered row. Row length only finds the file panel's
# right border, and when the preview pane happens to be empty that reads as
# "the preview is huge" — which is exactly how an earlier pass here concluded
# the setting saturated at 3 and then tuned it the wrong way twice.
file_preview_width = 2

#-- File Preview Border
enable_file_preview_border = false

#-- Sidebar Width
# 15 is the floor that still renders every shortcut label in full — "PublicShare"
# is the longest and fits exactly; below this they truncate to "Des...", "Dow...".
#
# It is also the ONLY lever left on preview size, and a weak one. At
# file_preview_width=2 superfile splits the non-sidebar area 50/50, so the file
# panel is structurally locked to the preview (always within 2 columns of it) and
# cannot be narrowed on its own. Every column freed from the sidebar is therefore
# split between them, and the preview keeps only half of it. Measured at 190
# columns: sidebar 20 -> preview 45%, 15 -> 46%, 10 -> 47%, 5 -> 48%, 0 -> 51%.
# Hiding the sidebar entirely is the only way past ~46%, and it costs the whole
# home/pinned/disks navigation to buy five points.
sidebar_width = 15

#-- Sidebar Section Order
sidebar_sections = ["home", "pinned", "disks"]

#-- Border
border_top = '─'
border_bottom = '─'
border_left = '│'
border_right = '│'
border_top_left = '╭'
border_top_right = '╮'
border_bottom_left = '╰'
border_bottom_right = '╯'
border_middle_left = '├'
border_middle_right = '┤'

###############################################################################
#                                   Plugins                                   #
###############################################################################

#-- Detailed Metadata
# Requires: exiftool
metadata = false

#-- MD5 Checksum Generation
enable_md5_checksum = false

#-- Zoxide Support
zoxide_support = false

#-- File opening rules
# Map file extensions to commands; the file path is appended as the last argument.
# MUST BE IN THE VERY END OF THE FILE BECAUSE TOML CANNOT CLOSE TABLES
[open_with]
mp3 = "spf-play"
flac = "spf-play"
ogg = "spf-play"
opus = "spf-play"
m4a = "spf-play"
wav = "spf-play"
aac = "spf-play"
wma = "spf-play"
