##############################################
#                                            #
#      LainCore DreamWeaver Dark Theme       #
#                                            #
##############################################

# DotCortex-managed (term.org). Palette source: style.org `lc/base16`
# 'dreamweaver-cc2017 — the same base16 canon as Rofi, kitty, Emacs, nvim,
# ranger, yazi and VSCodium. Do not edit here; edit term.org and re-tangle.
#
#   base00 #1f1f1f  base01 #242424  base02 #454545  base03 #6a6a6a
#   base04 #cbcbcb  base05 #d2d4d4  base06 #f0f0f0  base07 #ffffff
#   base08 #dc322f  base09 #cb4b16  base0A #b58900  base0B #4caf50
#   base0C #15b8cf  base0D #268bd2  base0E #a681d6  base0F #4b6983

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# This palette's accent row is Solarized's own, so the code preview matches the
# UI rather than fighting it.
code_syntax_highlight = "solarized-dark256"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#d2d4d4"
full_screen_bg = "#1f1f1f"

#-- Gradient
# base0C -> base0E: the LainCore cyan-to-violet run.
gradient_color = ["#15b8cf", "#a681d6"]

#-- File Panel
file_panel_fg = "#d2d4d4"
file_panel_bg = "#1f1f1f"
file_panel_border = "#454545"
file_panel_border_active = "#15b8cf"
# Canonical folder gold (ruling 2026-07-10), not a base16 slot.
file_panel_top_directory_icon = "#ffcb63"
file_panel_top_path = "#268bd2"
file_panel_item_selected_fg = "#ffffff"
file_panel_item_selected_bg = "#454545"

#-- Footer
footer_fg = "#cbcbcb"
footer_bg = "#242424"
footer_border = "#454545"
footer_border_active = "#15b8cf"

#-- Sidebar
sidebar_fg = "#cbcbcb"
sidebar_bg = "#242424"
sidebar_title = "#15b8cf"
sidebar_border = "#242424"
sidebar_border_active = "#15b8cf"
sidebar_item_selected_fg = "#ffffff"
sidebar_item_selected_bg = "#454545"
sidebar_divider = "#6a6a6a"

#-- Modals
modal_fg = "#d2d4d4"
modal_bg = "#242424"
modal_border_active = "#15b8cf"
modal_cancel_fg = "#1f1f1f"
modal_cancel_bg = "#cb4b16"
modal_confirm_fg = "#1f1f1f"
modal_confirm_bg = "#4caf50"

#-- Help Menu
help_menu_hotkey = "#15b8cf"
help_menu_title = "#a681d6"

#-- Special
cursor = "#f0f0f0"
correct = "#4caf50"
error = "#dc322f"
hint = "#268bd2"
cancel = "#cb4b16"
