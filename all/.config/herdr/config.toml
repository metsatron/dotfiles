[terminal]
default_shell = "/usr/bin/bash"

[keys]
prefix = "ctrl+a"
focus_pane_left = "prefix+n"
focus_pane_down = "prefix+e"
focus_pane_up = "prefix+i"
focus_pane_right = "prefix+o"
navigate_pane_left = "n"
navigate_pane_down = "e"
navigate_pane_up = "i"
navigate_pane_right = "o"
previous_tab = "prefix+left"
next_tab = "prefix+right"
previous_agent = "prefix+up"
next_agent = "prefix+down"
edit_scrollback = "prefix+shift+e"
open_notification_target = "prefix+shift+o"
close_workspace = "prefix+w"
workspace_picker = "prefix+a"
new_tab = "prefix+t"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

# LainCore DreamWeave — base16 source: style.org `dreamweaver-cc2017`, same canon as
# kitty/rofi/yazi/emacs/nvim. herdr has no user theme files, only [theme.custom]
# overrides on a built-in base; one-dark is the closest neutral-dark base for any
# slot we don't override. Slot names: 6 documented (panel_bg accent red green blue
# yellow) + binary-probed catppuccin-style extras. VERIFIED 2026-07-10: unknown
# custom keys are silently ignored (no reload diagnostic), so the extras are
# best-effort — harmless if wrong, only the visual result confirms them.
[theme]
name = "one-dark"
auto_switch = false

[theme.custom]
panel_bg = "#1f1f1f"   # base00
surface0 = "#242424"   # base01
surface1 = "#454545"   # base02
overlay0 = "#6a6a6a"   # base03
overlay1 = "#cbcbcb"   # base04
subtext0 = "#cbcbcb"   # base04
text     = "#d2d4d4"   # base05
accent   = "#15b8cf"   # base0C — LainCore cyan
red      = "#dc322f"   # base08
green    = "#4caf50"   # base0B
yellow   = "#ffcb63"   # folder gold (Mètsàtron 2026-07-10) over base0A
blue     = "#268bd2"   # base0D
magenta  = "#a681d6"   # base0E
cyan     = "#15b8cf"   # base0C

[ui.toast]
delivery = "system"

# Kitty graphics in panes (yazi/chafa image previews) — upstream-experimental since 0.5.9,
# confirmed required-on by field reports (default-off renders nothing). Known gap: images
# inside nvim panes may still show blank (upstream issue). Perplexity-verified 2026-07-10.
[experimental]
kitty_graphics = true
