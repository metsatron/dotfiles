- id: connection
  config:
    trustedHosts: ['@DSH_WEB_TRUSTED_HOST@']

- id: llm-pi-ai
  config:
    providers:
      neuralwatt:
        displayName: NeuralWatt
        apiKeyEnv: NEURALWATT_API_KEY
        api: openai-completions
        baseURL: https://api.neuralwatt.com/v1
        models:
          - id: deepseek-v4.1-flash-flex
            contextWindow: 1048560
            maxTokens: 393216
            input: [text]
            compat:
              thinkingFormat: deepseek
      helmcortex-opencode-go:
        displayName: HelmCortex OpenCode Go
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: helmcortex-deepseek-harness
        models:
          - id: deepseek-v4.1-flash
            contextWindow: 1000000
            maxTokens: 384000
            input: [text, image]
            compat:
              thinkingFormat: deepseek

- id: agent-default-model
  config:
    provider: neuralwatt
    model: deepseek-v4.1-flash-flex

- id: llm-deepseek
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

- insert:
    # Only the isolated Orca seat receives these operator-authorized roots.
    - id: orca-seat-scope
      name: /home/metsatron/DotCortex/all/.bots/templates/orca-seat-scope.mjs
      disabled: !!js process.env.HOME !== '/home/agent-deepseek'
      config:
        roots:
          - /home/metsatron/HelmCortex/FORGE/centre-apps
          - /home/metsatron/HelmCortex/ROOTS/DotRoot/agent-session/centre
          - /home/metsatron/HelmCortex/LOGS
          - /home/metsatron/Mail

    - id: mcp-recall
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: recall
        transport: streamable-http
        url: @DSH_RECALL_MCP_URL@
        failOnStartupError: false

    - id: mcp-timeark
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: timeark
        transport: stdio
        command: /home/metsatron/HelmCortex/FORGE/bin/helmcortex-anaconda
        args:
          - /home/metsatron/HelmCortex/CORE/TimeArk/server.py
        cwd: /home/metsatron/HelmCortex
        failOnStartupError: false

    - id: mcp-fleet-health
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: fleet-health
        transport: stdio
        command: /home/metsatron/HelmCortex/FORGE/bin/helmcortex-anaconda
        args:
          - /home/metsatron/HelmCortex/FORGE/bin/fleet-health-mcp
        cwd: /home/metsatron/HelmCortex
        failOnStartupError: false

    - id: mcp-memory-out
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memory-out
        transport: stdio
        command: /home/metsatron/HelmCortex/FORGE/bin/helmcortex-anaconda
        args:
          - /home/metsatron/HelmCortex/FORGE/bin/deepseek-memory-out-mcp
        cwd: /home/metsatron/HelmCortex
        failOnStartupError: false

    - id: mcp-agentify
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: agentify
        transport: stdio
        command: /home/metsatron/DotCortex/all/.local/bin/agentify-desktop-mcp
        cwd: /home/metsatron/HelmCortex
        failOnStartupError: false
