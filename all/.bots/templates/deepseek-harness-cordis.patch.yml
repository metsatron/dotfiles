- id: agent-default-model
  config:
    provider: neuralwatt
    model: deepseek-v4-flash

- id: llm-deepseek
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: tool-web
  disabled: true

- insert:
    - id: mcp-recall
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: recall
        transport: streamable-http
        url: @DSH_RECALL_MCP_URL@
        failOnStartupError: false

    - id: mcp-timeark
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: timeark
        transport: stdio
        command: /home/metsatron/HelmCortex/FORGE/bin/helmcortex-anaconda
        args:
          - /home/metsatron/HelmCortex/CORE/TimeArk/server.py
        cwd: /home/metsatron/HelmCortex
        failOnStartupError: false

    - id: mcp-agentify
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: agentify
        transport: stdio
        command: /home/metsatron/.local/bin/agentify-desktop
        args:
          - mcp
        cwd: /home/metsatron/HelmCortex
        failOnStartupError: false
