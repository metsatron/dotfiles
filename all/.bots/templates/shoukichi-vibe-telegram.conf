# Shoukichi launch configuration (non-secret values the wrapper pins).
VIBE_BRIDGE_WORKSPACE=$HOME/HelmCortex/FORGE/brain/shoukichi
VIBE_BRIDGE_LANG=en
# HTTP automation endpoint stays disabled: VIBE_BRIDGE_HTTP_TOKEN is
# deliberately absent. The MailCortex seat (if ever provisioned) would be
# an Admiral-gated private addition.
VIBE_BRIDGE_FORBIDDEN_MODES=auto-approve
VIBE_BRIDGE_WHISPER_MODEL=small
VIBE_BRIDGE_VOICE=Kiki
VIBE_BRIDGE_VOICE_MODEL=KittenML/kitten-tts-nano-0.8-int8
VIBE_BRIDGE_VOICE_SPEED=1.2
