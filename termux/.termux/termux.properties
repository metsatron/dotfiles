# Termux shell configuration
# https://wiki.termux.com/wiki/Terminal_Settings

# Bell notification
bell=vibrate

# Close keyboard after return in shell
back-key=back

# Extra keys row
extra-keys = [['ESC','|','/','~','`'],['TAB','CTRL','ALT','DEL']]

# Cursor/bell/IME handling
cursor-blink-rate=500

# Use black background
use-black-ui=true

# Tasker self-heal lane (2026-08-17): allow external apps to reach Termux
# so Tasker can restart the Termux service when the app dies. Tasker
# additionally needs the com.termux.permission.RUN_COMMAND grant (via
# rish: pm grant net.dinglisch.android.taskerm ...). The working shape is
# the Termux:Tasker PLUGIN executing ~/.termux/tasker/termux-revive in
# the background — raw RUN_COMMAND intents from Tasker proved unusable
# (Tasker sends extras as strings, Termux reads RUN_COMMAND_BACKGROUND
# with getBooleanExtra -> the flag is ignored and a terminal session
# steals the screen every heartbeat; bitten live 2026-08-17 evening).
allow-external-apps=true
