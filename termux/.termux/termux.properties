# Termux shell configuration
# https://wiki.termux.com/wiki/Terminal_Settings

# Bell notification
bell=vibrate

# Close keyboard after return in shell
back-key=back

# Extra keys row
extra-keys = [['ESC','|','/','~','`'],['TAB','CTRL','ALT','DEL']]

# Cursor/bell/IME handling
cursor-blink-rate=500

# Use black background
use-black-ui=true

# Tasker self-heal lane (2026-08-17): allow external apps to fire Termux's
# RUN_COMMAND intent so Tasker can restart the Termux service in the
# BACKGROUND when the app dies — no UI popped, supervision returns on its
# own. Tasker additionally needs the com.termux.permission.RUN_COMMAND
# grant (done via rish: pm grant net.dinglisch.android.taskerm ...).
allow-external-apps=true
