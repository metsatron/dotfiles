# ~/DotCortex/termux/.config/pulse/client.conf
# One audio authority: the runit-supervised pulseaudio (package-termux.org,
# Service supervision). Never autospawn a private daemon — that is how the
# 2026-08-28 boot race produced three servers and overlapping consort voices.
autospawn = no
# Fixed socket address — the supervised daemon's pinned XDG_RUNTIME_DIR
# (Service supervision, 2026-08-29). No *-runtime symlink dance, no random
# tmp dir a sweeper can delete out from under the daemon, identical from
# every client environment (ssh, boot, interactive, proot enclave).
default-server = unix:/data/data/com.termux/files/usr/var/run/pulse-runtime/pulse/native
