# [[file:../../../../../services.org::*Recall MCP daemon — X230 (systemd user unit)][Recall MCP daemon — X230 (systemd user unit):2]]
# X230 thermal policy: bounded CPU for an interactive service — niced, capped at two
# cores, but NOT idle-class (queries must answer promptly).
[Service]
Nice=10
CPUWeight=50
CPUQuota=200%
