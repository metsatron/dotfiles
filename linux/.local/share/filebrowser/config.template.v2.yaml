# Quantum 2 (v2.x) shape of the template beside it; the sources, auth and integrations are the same — keep the two in lockstep; the
# EXAMPLE is canonical. filebrowser-provision renders this into the machine-local
# $HOME/.config/filebrowser/config.yaml (placeholders expanded there, never here).
http:
  # Loopback only; Caddy TLS front (caddy-serve :9090) is the tailnet listener.
  port: 9091
  listen: 127.0.0.1
  internalUrl: YOUR_CALLBACK_URL
server:
  database:
    # Machine-local SQLite (users, settings), in the state tree and out of any
    # DotCortex-synced path. Quantum 2 reserves the name database.db for the
    # legacy file, so this one is named differently. To migrate an old Quantum 1
    # database, filebrowser-config-v2 adds migrateFrom; a fresh install has none.
    path: $HOME/.local/state/filebrowser/filebrowser.sqlite
  # Absolute cache path: the default "tmp" is RELATIVE to the cwd - running the
  # binary from a worktree litters it with cache dirs (observed 2026-10-09).
  cacheDir: $HOME/.local/state/filebrowser/cache
  sources:
    # Hard drive root: read-only whole-filesystem view. The Admiral's
    # 'hard drive' icon opens here. readOnly is a real per-source flag
    # (v1.5.6 config.generated.yaml) — UI, WebDAV, and API writes are all
    # disabled for this source.
    - name: root
      path: /
      config:
        defaultEnabled: true
        readOnly: true
        private: true   # no shares from this source
        rules:
          # Browse everything, index nothing: viewable keeps the folder reachable but out of the SQLite search index (3.6 GB on 23 Nov 2026, v1.5.8).
          - folderPath: "/"
            viewable: true
          - folderPath: "/NEXUS"                    # KeePass vaults + repo mirrors
          - folderPath: "/home/RENDERED_USER/.ssh"   # rendered at provisioning
          - folderPath: "/root/.ssh"
          - folderName: ".ssh"
          - folderPath: "/etc/caddy"
          - folderPath: "/etc/ssl/private"
          - folderPath: "/etc/letsencrypt/live"
          - fileName: ".env"
          - fileEndsWith: ".env"
          - folderName: "node_modules"
          - fileEndsWith: ".kdbx"
          - fileEndsWith: ".kdbx.key"
    # Home: the writable working source.
    - name: home
      path: $HOME
      config:
        defaultEnabled: true
        private: true   # no shares — tailnet-only by policy (sovereignty rule)
        rules:
          - folderPath: "/"
            viewable: true
          - folderPath: "NEXUS"
          - folderPath: ".ssh"
          - folderPath: ".config/filebrowser"
          - folderPath: ".local/share/dotcortex/tests"
          - fileName: ".env"
          - fileEndsWith: ".env"
          - fileEndsWith: ".kdbx"
          - fileEndsWith: ".kdbx.key"
    # Mounted fleet shares.
    - name: mnt
      path: $HOME/mnt
      config:
        defaultEnabled: true
        private: true
        rules:
          - folderPath: "/"
            viewable: true
    # Pictures gallery.
    - name: pictures
      path: $HOME/Pictures
      config:
        defaultEnabled: true
        private: true
    # Sanctuary Cortex guest home (deep-linked from the Centre desktop icons).
    - name: sanctuary-cortex
      path: $HOME/.local/share/dotcortex/guests/sanctuary-cortex/home
      config:
        defaultEnabled: true
        private: true
auth:
  tokenExpirationHours: 720  # 30 days for tokens issued at the next login
  methods:
    password:
      enabled: true
      signup: false
userDefaults:
  fileViewer:
    preferEditorForMarkdown: true  # existing accounts still choose their profile preference
integrations:
  office:
    url: YOUR_OFFICE_URL
    internalUrl: YOUR_OFFICE_INTERNAL_URL
