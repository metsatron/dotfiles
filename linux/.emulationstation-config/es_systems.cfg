<!-- EmulationStation systems — tangled from retropie.org (DotCortex).
     Do not edit here; edit the Org source and re-tangle.
     RetroPie-convention paths: ~/RetroPie/roms/<system>, ~/RetroPie/BIOS.
     ~ expands to the sanctuary guest home, where vm-homes-init projects
     ~/RetroPie and ~/.guix-extra-profiles from the host. -->
<systemList>

  <system>
    <name>nes</name>
    <fullname>Nintendo Entertainment System</fullname>
    <path>~/RetroPie/roms/nes</path>
    <extension>.nes .NES .unf .UNF .unif .UNIF .zip .ZIP .7z .7Z</extension>
    <command>~/.guix-extra-profiles/room-retropie/room-retropie/bin/retroarch -L ~/.guix-extra-profiles/room-retropie/room-retropie/lib/libretro/nestopia_libretro.so %ROM%</command>
    <platform>nes</platform>
    <theme>nes</theme>
  </system>

  <system>
    <name>famicom</name>
    <fullname>Nintendo Family Computer</fullname>
    <path>~/RetroPie/roms/famicom</path>
    <extension>.nes .NES .unf .UNF .unif .UNIF .zip .ZIP .7z .7Z</extension>
    <command>~/.guix-extra-profiles/room-retropie/room-retropie/bin/retroarch -L ~/.guix-extra-profiles/room-retropie/room-retropie/lib/libretro/nestopia_libretro.so %ROM%</command>
    <platform>nes</platform>
    <theme>famicom</theme>
  </system>

  <system>
    <name>fds</name>
    <fullname>Famicom Disk System</fullname>
    <path>~/RetroPie/roms/fds</path>
