# Global defaults

# This token-free file is the global declarative switch and stable fallback.
# Set =BUILDSTAMP_ENABLED=0= here to disable the feature for all schemes.  A user
# may instead keep private mutable overrides in
# =~/.config/redstone-9x/buildstamp.local=; that file is never tangled.

# =DESKTOP_LABEL_FOREGROUND= and =DESKTOP_LABEL_SHADOW= are the shared colour
# contract for both the PCManFM desktop-icon labels and this XOSD build label.
# They must either both be =auto= or both be literal =#rrggbb= colours.  See
# [[*Adaptive contrast]].  Private =buildstamp.local= overrides may use these same
# shared keys; scheme-apply must be rerun so both renderers receive the change.


# [[file:../../../sanctuary-redstone-9x-buildstamp.org::*Global defaults][Global defaults:1]]
# Redstone build-stamp defaults. Desktop Schemes may override style keys and
# the shared DESKTOP_LABEL_* colour contract.
BUILDSTAMP_ENABLED=1
BUILDSTAMP_PRODUCT_FONT="-misc-fixed-bold-r-normal--12-*-*-*-c-*-iso10646-1"
BUILDSTAMP_PRODUCT_FONT_SIZE=12
BUILDSTAMP_DETAIL_FONT="-misc-fixed-medium-r-normal--12-*-*-*-c-*-iso10646-1"
BUILDSTAMP_DETAIL_FONT_SIZE=12
BUILDSTAMP_LINE_GAP=2
# Both "auto" samples the backdrop once; two literal colours pin the shared pair.
DESKTOP_LABEL_FOREGROUND="auto"
DESKTOP_LABEL_SHADOW="auto"
BUILDSTAMP_SHADOW_OFFSET=1
BUILDSTAMP_RIGHT_MARGIN=14
BUILDSTAMP_BOTTOM_MARGIN=12
# Mean backdrop luma (0-255) at or above which the stamp flips to dark-on-light.
BUILDSTAMP_CONTRAST_THRESHOLD=128
# Width of the sampled strip, in pixels, measured left from the right margin.
BUILDSTAMP_SAMPLE_WIDTH=360
# Global defaults:1 ends here
