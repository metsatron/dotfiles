# PX68K-only RetroArch window defaults.  This is appended at launch so the
# user's mutable retroarch.cfg remains intact.  Godzilla's Xephyr room is a
# 1920x1080 output: 1200x900 at (360,90) keeps the decorated 4:3 window
# centered while leaving the SX desktop and device rail visible around it.
# Measured PX68K winner: threaded presentation with VSync and audio sync kept
# enabled.  These launch-only values pin the responsive path without rewriting
# RetroArch's mutable room configuration.
video_threaded = "true"
video_vsync = "true"
video_swap_interval = "1"
audio_sync = "true"
video_fullscreen = "false"
# Keep this a normal decorated window; the requested size and position are
# otherwise ignored by RetroArch's borderless windowed-fullscreen mode.
video_windowed_fullscreen = "false"
video_aspect_ratio_auto = "true"
video_window_custom_size_enable = "true"
video_windowed_position_width = "1200"
video_windowed_position_height = "900"
video_windowed_position_x = "360"
video_windowed_position_y = "90"
video_window_save_positions = "false"
