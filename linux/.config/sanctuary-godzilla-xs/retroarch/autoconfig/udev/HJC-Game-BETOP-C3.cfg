# HJC Game BETOP C3 (20bc:0de0; 8380:3552).
# BTP-03 in PC/DirectInput mode.  Button indices verified with evtest
# 2026-08-05 -- the HID report order does NOT match kernel event code names.
# HID 1-10 map to kernel indices 0-9; kernel indices 10-11 are phantom
# (present in the capability bitmask but never fire).
# Saturn 2x3 face grid: C and Z land on L3/R3 since RetroArch's SNES
# layout has only four face buttons.  Per-core remaps handle fighting games.
input_driver = "udev"
input_device = "HJC Game BETOP C3"
input_device_display_name = "BTP-03 Sega Saturn Pad (PC mode)"
input_vendor_id = "8380"
input_product_id = "3552"

input_b_btn = "2"
input_a_btn = "1"
input_y_btn = "3"
input_x_btn = "0"
input_l_btn = "4"
input_r_btn = "6"
input_l3_btn = "7"
input_r3_btn = "5"
input_select_btn = "8"
input_start_btn = "9"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"

input_b_btn_label = "A"
input_a_btn_label = "B"
input_y_btn_label = "X"
input_x_btn_label = "Y"
input_l_btn_label = "L"
input_r_btn_label = "R"
input_l3_btn_label = "C"
input_r3_btn_label = "Z"
input_select_btn_label = "Select"
input_start_btn_label = "Start"
input_up_btn_label = "D-Pad Up"
input_down_btn_label = "D-Pad Down"
input_left_btn_label = "D-Pad Left"
input_right_btn_label = "D-Pad Right"
