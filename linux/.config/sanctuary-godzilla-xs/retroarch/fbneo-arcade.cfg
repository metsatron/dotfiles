# FinalBurn Neo launch defaults for the aftermarket X68 Expansion Bus and the
# separate Neo Geo arcade branch.  This is appended at launch and does not
# rewrite RetroArch's mutable room configuration.
video_threaded = "true"
video_vsync = "true"
video_swap_interval = "1"
audio_sync = "true"
video_fullscreen = "false"
video_windowed_fullscreen = "false"
# Let each CPS/Neo Geo core announce its native geometry; this avoids forcing
# the X68000 4:3 window policy onto arcade outputs.
video_aspect_ratio_auto = "true"
aspect_ratio_index = "22"
video_allow_rotate = "true"
# The room profile points at a mutable system autoconfig tree.  The launcher
# projects the declared room-owned profiles into this path before games start.
input_autodetect_enable = "true"
input_joypad_driver = "udev"
# sanctuary-godzilla-xs-apps appends the actual guest-home autoconfig path at
# launch; the guest home is intentionally relocatable under the host state root.
