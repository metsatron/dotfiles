<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>San Francisco Display</family>
    <prefer>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
  <alias>
    <family>SF Pro Display</family>
    <prefer>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
